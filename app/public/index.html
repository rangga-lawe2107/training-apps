<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Monitoring</title>
    <style>
        body {
            font-family: "Poppins", sans-serif;
            margin: 0;
            background: #f4f7fa;
            color: #333;
        }

        header {
            background: linear-gradient(135deg, #007bff, #00bcd4);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            padding: 1.5rem;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
        }

        .chart-container {
            width: 100%;
            height: 200px;
        }

        footer {
            text-align: center;
            padding: 1rem;
            color: #777;
            font-size: 0.9rem;
        }

        .status {
            font-size: 1.2rem;
            font-weight: bold;
            color: #28a745;
        }

        .status.offline {
            color: #dc3545;
        }
    </style>
</head>

<body>
    <header>
        <h1>Dashboard Monitoring</h1>
        <div id="datetime"></div>
    </header>

    <section class="content">
        <div class="card">
            <h3>Server Status</h3>
            <p class="status" id="server-status">Connecting...</p>
        </div>

        <div class="card">
            <h3>CPU Usage</h3>
            <canvas id="cpuChart" class="chart-container"></canvas>
        </div>

        <div class="card">
            <h3>Memory Usage</h3>
            <canvas id="memoryChart" class="chart-container"></canvas>
        </div>
    </section>

    <footer>
        &copy; 2025 Monitoring Dashboard | Real-time System Overview
    </footer>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        // === Dynamic DateTime ===
        function updateDateTime() {
            const now = new Date();
            document.getElementById("datetime").innerText = now.toLocaleString();
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        // === Charts ===
        const cpuCtx = document.getElementById("cpuChart").getContext("2d");
        const memoryCtx = document.getElementById("memoryChart").getContext("2d");

        const cpuChart = new Chart(cpuCtx, {
            type: "line",
            data: {
                labels: [],
                datasets: [{
                    label: "CPU (%)",
                    data: [],
                    borderColor: "#007bff",
                    tension: 0.3
                }]
            },
            options: {
                scales: { y: { beginAtZero: true, max: 100 } }
            }
        });

        const memoryChart = new Chart(memoryCtx, {
            type: "line",
            data: {
                labels: [],
                datasets: [{
                    label: "Memory (%)",
                    data: [],
                    borderColor: "#00bcd4",
                    tension: 0.3
                }]
            },
            options: {
                scales: { y: { beginAtZero: true, max: 100 } }
            }
        });

        // === Simulate Data ===
        let time = 0;
        setInterval(() => {
            if (cpuChart.data.labels.length > 10) {
                cpuChart.data.labels.shift();
                cpuChart.data.datasets[0].data.shift();
                memoryChart.data.labels.shift();
                memoryChart.data.datasets[0].data.shift();
            }

            cpuChart.data.labels.push(time++);
            memoryChart.data.labels.push(time);

            cpuChart.data.datasets[0].data.push(Math.random() * 100);
            memoryChart.data.datasets[0].data.push(50 + Math.random() * 40);

            cpuChart.update();
            memoryChart.update();
        }, 2000);

        // === Server Status Simulation ===
        const statusEl = document.getElementById("server-status");
        function simulateServerStatus() {
            const online = Math.random() > 0.2;
            statusEl.textContent = online ? "Online" : "Offline";
            statusEl.className = "status " + (online ? "" : "offline");
        }
        setInterval(simulateServerStatus, 5000);
        simulateServerStatus();
    </script>
</body>

</html>
